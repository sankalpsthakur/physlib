name: Apply module documentation patch

on:
  push:
    branches:
      - agent/standard-model-module-docs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused documentation patch
        shell: bash
        run: |
          if [ ! -f .agent-patch.sh ]; then
            exit 0
          fi
          bash .agent-patch.sh
